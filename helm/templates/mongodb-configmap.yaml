apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
data:
  MONGO_INITDB_DATABASE: "sharelatex"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
data:
  mongodb-init-replica-set.js: |
    // This script is run by MongoDB when initializing the database
    // It sets up the replica set required by Overleaf

    // Wait for MongoDB to be ready
    sleep(5000);

    try {
      rs.status();
      print("Replica set already initialized");
    } catch (err) {
      print("Initializing replica set...");
      rs.initiate({
        _id: "overleaf",
        members: [
          { _id: 0, host: "mongodb-service:27017" }
        ]
      });
      print("Replica set initialized");
    }
