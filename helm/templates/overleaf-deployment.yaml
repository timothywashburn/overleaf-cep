apiVersion: apps/v1
kind: Deployment
metadata:
  name: overleaf
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: overleaf
  template:
    metadata:
      labels:
        app: overleaf
    spec:
      imagePullSecrets:
      - name: dockerhub-registry
      containers:
      - name: overleaf
        image: {{ .Values.image.overleaf.name }}:{{ .Values.image.overleaf.tag | default "latest" }}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: OVERLEAF_APP_NAME
          value: "Overleaf Extended Community Edition"
        - name: OVERLEAF_SITE_URL
          value: "https://{{ .Values.ingress.host }}"
        - name: OVERLEAF_MONGO_URL
          value: "mongodb://mongodb-0.mongodb-service.{{ .Release.Namespace }}.svc.cluster.local:27017/sharelatex?replicaSet=overleaf&directConnection=true"
        - name: OVERLEAF_REDIS_HOST
          value: "redis-0.redis-service"
        - name: REDIS_HOST
          value: "redis-0.redis-service"
        - name: ENABLED_LINKED_FILE_TYPES
          value: "project_file,project_output_file"
        - name: ENABLE_CONVERSIONS
          value: "true"
        - name: EMAIL_CONFIRMATION_DISABLED
          value: "true"
        - name: SANDBOXED_COMPILES
          value: "true"
        - name: SANDBOXED_COMPILES_HOST_DIR_COMPILES
          value: "/var/lib/overleaf/data/compiles"
        - name: SANDBOXED_COMPILES_HOST_DIR_OUTPUT
          value: "/var/lib/overleaf/data/output"
        - name: DOCKER_RUNNER
          value: "true"
        - name: SANDBOXED_COMPILES_SIBLING_CONTAINERS
          value: "true"
        - name: TEX_LIVE_DOCKER_IMAGE
          value: "texlive/texlive@sha256:aa6bf7be89bd1cd9b0b1cda65307dba1e3305cd8c2bb5bae9d245b6766f209e5"
        - name: TEXLIVE_IMAGE
          value: "texlive/texlive@sha256:aa6bf7be89bd1cd9b0b1cda65307dba1e3305cd8c2bb5bae9d245b6766f209e5"
        - name: ALLOWED_COMPILE_GROUPS
          value: "standard"
        - name: ALLOWED_IMAGES
          value: "texlive/texlive@sha256:aa6bf7be89bd1cd9b0b1cda65307dba1e3305cd8c2bb5bae9d245b6766f209e5"
        - name: ALL_TEX_LIVE_DOCKER_IMAGES
          value: "texlive/texlive@sha256:aa6bf7be89bd1cd9b0b1cda65307dba1e3305cd8c2bb5bae9d245b6766f209e5"
        - name: DOCKER_HOST
          value: "tcp://localhost:2375"
        {{- if .Values.oidc.enabled }}
        - name: EXTERNAL_AUTH
          value: "oidc"
        - name: OVERLEAF_OIDC_ISSUER
          value: "https://{{ .Values.oidc.authDomain }}/application/o/overleaf/"
        - name: OVERLEAF_OIDC_AUTHORIZATION_URL
          value: "https://{{ .Values.oidc.authDomain }}/application/o/authorize/"
        - name: OVERLEAF_OIDC_TOKEN_URL
          value: "https://{{ .Values.oidc.authDomain }}/application/o/token/"
        - name: OVERLEAF_OIDC_USER_INFO_URL
          value: "https://{{ .Values.oidc.authDomain }}/application/o/userinfo/"
        - name: OVERLEAF_OIDC_LOGOUT_URL
          value: "https://{{ .Values.oidc.authDomain }}/application/o/overleaf/end-session/"
        - name: OVERLEAF_OIDC_CLIENT_ID
          value: "{{ .Values.oidc.clientId }}"
        - name: OVERLEAF_OIDC_CLIENT_SECRET
          value: "{{ .Values.oidc.clientSecret }}"
        - name: OVERLEAF_OIDC_PROVIDER_NAME
          value: "{{ .Values.oidc.provider }}"
        - name: OVERLEAF_OIDC_SCOPE
          value: "openid profile email"
{{/*        - name: OVERLEAF_OIDC_USER_ID_FIELD*/}}
{{/*          value: "sub"*/}}
        {{- end }}
        envFrom:
        - secretRef:
            name: overleaf-secret
            optional: true
        volumeMounts:
        - name: overleaf-storage
          mountPath: /var/lib/overleaf
        - name: docker-storage
          mountPath: /var/run
        resources:
          requests:
            memory: "1Gi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      - name: docker-dind
        image: docker:29.1.3-dind
        securityContext:
          privileged: true
        env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
        lifecycle:
          postStart:
            exec:
              command:
              - sh
              - -c
              - |
                until docker info >/dev/null 2>&1; do
                  echo "Waiting for Docker daemon..."
                  sleep 2
                done
                echo "Docker daemon ready, pulling texlive..."
                docker pull texlive/texlive@sha256:aa6bf7be89bd1cd9b0b1cda65307dba1e3305cd8c2bb5bae9d245b6766f209e5 || echo "Failed to pull image, will retry on next pod start"
        volumeMounts:
          - name: docker-storage
            mountPath: /var/lib/docker
          - name: overleaf-storage
            mountPath: /var/lib/overleaf
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: overleaf-storage
        persistentVolumeClaim:
          claimName: overleaf-pvc
      - name: docker-storage
        persistentVolumeClaim:
          claimName: docker-pvc
