apiVersion: apps/v1
kind: Deployment
metadata:
  name: overleaf
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: overleaf
  template:
    metadata:
      labels:
        app: overleaf
    spec:
      imagePullSecrets:
      - name: dockerhub-registry
      containers:
      - name: overleaf
        image: {{ .Values.image.overleaf.name }}:{{ .Values.image.overleaf.tag | default "latest" }}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: OVERLEAF_APP_NAME
          value: "Overleaf Extended Community Edition"
        - name: OVERLEAF_MONGO_URL
          value: "mongodb://mongodb-0.mongodb:27017/sharelatex"
        - name: OVERLEAF_REDIS_HOST
          value: "redis-service"
        - name: REDIS_HOST
          value: "redis-service"
        - name: ENABLED_LINKED_FILE_TYPES
          value: "project_file,project_output_file"
        - name: ENABLE_CONVERSIONS
          value: "true"
        - name: EMAIL_CONFIRMATION_DISABLED
          value: "true"
        - name: SANDBOXED_COMPILES
          value: "true"
        - name: SANDBOXED_COMPILES_HOST_DIR_COMPILES
          value: "/var/lib/overleaf/data/compiles"
        - name: SANDBOXED_COMPILES_HOST_DIR_OUTPUT
          value: "/var/lib/overleaf/data/output"
        - name: DOCKER_RUNNER
          value: "true"
        - name: SANDBOXED_COMPILES_SIBLING_CONTAINERS
          value: "true"
        - name: TEX_LIVE_DOCKER_IMAGE
          value: "texlive/texlive:latest"
        - name: TEXLIVE_IMAGE
          value: "texlive/texlive:latest"
        - name: ALLOWED_COMPILE_GROUPS
          value: "standard"
        - name: DOCKER_RUNNER_PULL_IMAGES
          value: "false"
        - name: DOCKER_HOST
          value: "tcp://localhost:2375"
        envFrom:
        - secretRef:
            name: overleaf-secret
            optional: true
        volumeMounts:
        - name: overleaf-storage
          mountPath: /var/lib/overleaf
        - name: docker-storage
          mountPath: /var/run
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      - name: docker-dind
        image: docker:dind
        securityContext:
          privileged: true
        env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
        volumeMounts:
          - name: docker-storage
            mountPath: /var/lib/docker
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: overleaf-storage
        persistentVolumeClaim:
          claimName: overleaf-pvc
      - name: docker-storage
        emptyDir: {}
