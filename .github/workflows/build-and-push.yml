name: Build and Push
on:
  push:
    branches:
      - ext-ce
  workflow_dispatch:

concurrency:
  group: production_environment
  cancel-in-progress: true

env:
  DOCKER_IMAGE_BASE: kyrokrypt/overleaf-cep-base
  DOCKER_IMAGE_COMMUNITY: kyrokrypt/overleaf-cep

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server-ce/Dockerfile-base
          push: true
          platforms: linux/amd64
          tags: ${{ env.DOCKER_IMAGE_BASE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_BASE }}:${{ github.sha }}
          cache-to: type=inline

      - name: Build and push community edition image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server-ce/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            OVERLEAF_BASE_TAG=${{ env.DOCKER_IMAGE_BASE }}:${{ github.sha }}
          tags: ${{ env.DOCKER_IMAGE_COMMUNITY }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_COMMUNITY }}:${{ github.sha }}
          cache-to: type=inline
